# Generic edit form shared by every custom entity type: properties tab with
# the code, the inferred fields and the label translations, plus history.
#
# To customise one entity, copy this tree under another root code in your
# own bundle and set "edit_form: <root code>" in its configuration.
extensions:
    danmyers-custom-entity-edit-form:
        module: pim/form/common/edit-form

    danmyers-custom-entity-edit-form-breadcrumbs:
        module: danmyers-custom-entity/common/breadcrumbs
        parent: danmyers-custom-entity-edit-form
        targetZone: breadcrumbs
        config:
            tab: danmyers-custom-entity-menu

    danmyers-custom-entity-edit-form-user-navigation:
        module: pim/menu/user-navigation
        parent: danmyers-custom-entity-edit-form
        targetZone: user-menu
        config:
            userAccount: pim_menu.user.user_account
            logout: pim_menu.user.logout

    danmyers-custom-entity-edit-form-cache-invalidator:
        module: pim/cache-invalidator
        parent: danmyers-custom-entity-edit-form
        position: 1000

    danmyers-custom-entity-edit-form-form-tabs:
        module: pim/form/common/form-tabs
        parent: danmyers-custom-entity-edit-form
        targetZone: content
        position: 90

    danmyers-custom-entity-edit-form-label:
        module: danmyers-custom-entity/form/edit/title
        parent: danmyers-custom-entity-edit-form
        targetZone: title
        position: 110

    danmyers-custom-entity-edit-form-secondary-actions:
        module: pim/form/common/secondary-actions
        parent: danmyers-custom-entity-edit-form
        targetZone: buttons
        position: 50

    danmyers-custom-entity-edit-form-delete:
        module: danmyers-custom-entity/form/edit/delete
        parent: danmyers-custom-entity-edit-form-secondary-actions
        targetZone: secondary-actions
        position: 100

    danmyers-custom-entity-edit-form-save-buttons:
        module: pim/form/common/save-buttons
        parent: danmyers-custom-entity-edit-form
        targetZone: buttons
        position: 100

    danmyers-custom-entity-edit-form-save:
        module: danmyers-custom-entity/form/edit/save
        parent: danmyers-custom-entity-edit-form
        targetZone: buttons
        position: 0

    danmyers-custom-entity-edit-form-state:
        module: pim/form/common/state
        parent: danmyers-custom-entity-edit-form
        targetZone: state
        position: 900
        config:
            entity: danmyers_custom_entity.edit.entity

    danmyers-custom-entity-edit-form-created:
        module: pim/form/common/meta/created
        parent: danmyers-custom-entity-edit-form
        targetZone: meta
        position: 90
        config:
            label: danmyers_custom_entity.edit.meta.created
            labelBy: danmyers_custom_entity.edit.meta.by

    danmyers-custom-entity-edit-form-updated:
        module: pim/form/common/meta/updated
        parent: danmyers-custom-entity-edit-form
        targetZone: meta
        position: 100
        config:
            label: danmyers_custom_entity.edit.meta.updated
            labelBy: danmyers_custom_entity.edit.meta.by

    danmyers-custom-entity-edit-form-properties-tab:
        module: pim/common/tab
        parent: danmyers-custom-entity-edit-form-form-tabs
        targetZone: container
        position: 100
        config:
            label: pim_common.properties

    danmyers-custom-entity-edit-form-properties:
        module: pim/common/simple-view
        parent: danmyers-custom-entity-edit-form-properties-tab
        targetZone: self
        config:
            template: pim/template/form/tab/sections

    danmyers-custom-entity-edit-form-properties-general-section:
        module: pim/common/simple-view
        parent: danmyers-custom-entity-edit-form-properties
        targetZone: accordion
        position: 100
        config:
            template: pim/template/form/tab/section
            templateParams:
                sectionTitle: pim_common.general_properties
                dropZone: content

    danmyers-custom-entity-edit-form-properties-code:
        module: pim/form/common/fields/text
        parent: danmyers-custom-entity-edit-form-properties-general-section
        targetZone: content
        position: 10
        config:
            fieldName: code
            label: pim_common.code
            readOnly: true

    danmyers-custom-entity-edit-form-properties-fields:
        module: danmyers-custom-entity/form/fields
        parent: danmyers-custom-entity-edit-form-properties-general-section
        targetZone: content
        position: 20

    danmyers-custom-entity-edit-form-properties-translation-section:
        module: danmyers-custom-entity/form/edit/translation-section
        parent: danmyers-custom-entity-edit-form-properties
        targetZone: accordion
        position: 110
        config:
            template: pim/template/form/tab/section
            templateParams:
                sectionTitle: pim_common.label_translations
                dropZone: content

    danmyers-custom-entity-edit-form-properties-translation:
        module: danmyers-custom-entity/form/edit/translations
        parent: danmyers-custom-entity-edit-form-properties-translation-section
        targetZone: content
        position: 100

    danmyers-custom-entity-edit-form-history:
        module: danmyers-custom-entity/form/edit/history
        parent: danmyers-custom-entity-edit-form-form-tabs
        targetZone: container
        position: 120
        config:
            title: pim_common.history
